name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: spotui-dist
          path: release-assets

      - name: Assemble release assets and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "release-assets/spotui-${version}-py3-none-any.whl"
          test -f "release-assets/spotui-${version}.tar.gz"
          cp scripts/install.sh scripts/uninstall.sh release-assets/
          chmod +x release-assets/install.sh release-assets/uninstall.sh
          (
            cd release-assets
            sha256sum * > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          ls -lh release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpotUI ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
