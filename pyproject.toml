[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spotui"
dynamic = ["version"]
description = "Local Amazon Music search and download application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SpotUI contributors" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "mutagen>=1.47",
    "playwright>=1.40",
    "pydantic>=2.8",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/runtime-terror404/spotui"

[project.scripts]
spotui = "spotui.cli:main"

[tool.hatch.version]
path = "src/spotui/__init__.py"

[tool.hatch.build]
# Vite assets are generated and gitignored, but must ship in wheel and sdist.
artifacts = ["src/spotui/web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/spotui"]

[tool.hatch.build.targets.sdist]
include = [
    "alembic.ini",
    "docs",
    "scripts",
    "src/spotui",
    "tests",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
