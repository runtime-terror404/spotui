<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SpotUI</title>
    <style>
      :root {
        --color-background: #f8f7fc;
        --color-surface: #fffbff;
        --color-surface-container: #f0ecf5;
        --color-text: #1c1b22;
        --color-text-secondary: #48454f;
        --color-outline: #797582;
        --color-primary: #62518c;
        --color-on-primary: #ffffff;
        --color-primary-container: #e9ddff;
        --color-on-primary-container: #24143b;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-background: #141218;
          --color-surface: #1c1a22;
          --color-surface-container: #24212c;
          --color-text: #e7e0eb;
          --color-text-secondary: #cac4d0;
          --color-outline: #938d9b;
          --color-primary: #d0bcff;
          --color-on-primary: #381e72;
          --color-primary-container: #4f3785;
          --color-on-primary-container: #eaddff;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--color-background);
        color: var(--color-text);
        font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(100%, 620px);
        padding: 32px;
        border: 1px solid var(--color-outline);
        border-radius: 16px;
        background: var(--color-surface);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.75rem, 4vw, 2rem);
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--color-text-secondary);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 20px 0 0;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--color-primary-container);
        color: var(--color-on-primary-container);
        font-size: 0.875rem;
        font-weight: 500;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 10px 16px;
        border: 1px solid var(--color-outline);
        border-radius: 12px;
        color: var(--color-text);
        font-weight: 500;
        text-decoration: none;
      }

      a.primary {
        border-color: transparent;
        background: var(--color-primary);
        color: var(--color-on-primary);
      }

      a:focus-visible {
        outline: 3px solid var(--color-primary);
        outline-offset: 2px;
      }

      .note {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--color-surface-container);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SpotUI</h1>
      <p>Local Amazon Music search and download application.</p>
      <p class="status">Application foundation is running</p>
      <div class="links">
        <a class="primary" href="/api/v1/health">Server health</a>
        <a href="/docs">API documentation</a>
      </div>
      <p class="note">
        The React search, detail, queue, and import interfaces are not built yet.
        This placeholder is served by the packaged application while those
        phases are implemented.
      </p>
    </main>
  </body>
</html>
